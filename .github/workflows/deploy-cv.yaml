name: Render and Deploy CV

on:
  push:
    branches: [main]
    paths:
      - "marine-cv-docs/**"
      - "src/rendercv/**"
      - ".github/workflows/deploy-cv.yaml"
  workflow_dispatch:  # manual trigger
  workflow_call:      # callable from other workflows

permissions:
  contents: write

jobs:
  render:
    name: Render CV to PDF/HTML
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install project dependencies
        run: uv sync --frozen --all-extras

      - name: Render full CV
        run: |
          uv run --frozen rendercv render \
            marine-cv-docs/Marine_Denolle_CV.yaml \
            --typst-path rendercv_output/Marine_Denolle_CV.typ \
            --pdf-path rendercv_output/Marine_Denolle_CV.pdf \
            --markdown-path rendercv_output/Marine_Denolle_CV.md \
            --html-path rendercv_output/Marine_Denolle_CV.html \
            --png-path rendercv_output/Marine_Denolle_CV.png

      - name: Generate department CV sections
        run: |
          uv run --frozen python scripts/generate_dept_sections.py

      - name: Render department CV (College of Environment FAR format)
        run: |
          uv run --frozen rendercv render \
            marine-cv-docs/Marine_Denolle_Dept_CV.yaml \
            --typst-path rendercv_output/Marine_Denolle_Dept_CV.typ \
            --pdf-path rendercv_output/Marine_Denolle_Dept_CV.pdf \
            --markdown-path rendercv_output/Marine_Denolle_Dept_CV.md \
            --html-path rendercv_output/Marine_Denolle_Dept_CV.html \
            --png-path rendercv_output/Marine_Denolle_Dept_CV.png

      - name: Render CV without publications
        run: |
          uv run --frozen python scripts/make_cv_without_publications.py
          uv run --frozen rendercv render \
            marine-cv-docs/Marine_Denolle_CV_no_publications.yaml \
            --typst-path rendercv_output/Marine_Denolle_CV_no_publications.typ \
            --pdf-path rendercv_output/Marine_Denolle_CV_no_publications.pdf \
            --markdown-path rendercv_output/Marine_Denolle_CV_no_publications.md \
            --html-path rendercv_output/Marine_Denolle_CV_no_publications.html \
            --png-path rendercv_output/Marine_Denolle_CV_no_publications.png

      - name: Render publications list
        run: |
          uv run --frozen rendercv render \
            marine-cv-docs/Marine_Denolle_Publications.yaml \
            --typst-path rendercv_output/Marine_Denolle_Publications.typ \
            --pdf-path rendercv_output/Marine_Denolle_Publications.pdf \
            --markdown-path rendercv_output/Marine_Denolle_Publications.md \
            --html-path rendercv_output/Marine_Denolle_Publications.html \
            --png-path rendercv_output/Marine_Denolle_Publications.png

      - name: Commit rendered output if changed
        run: |
          set -euo pipefail

          # Only a run on main may commit to main (workflow_dispatch can start from any ref)
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::notice::Run on ${GITHUB_REF}, not main: skipping commit and push"
            exit 0
          fi

          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add marine-cv-docs/rendercv_output/
          git add marine-cv-docs/dept_cv_sections/
          git add marine-cv-docs/Marine_Denolle_CV_no_publications.yaml

          if git diff --staged --quiet; then
            exit 0
          fi

          git commit -m "chore: render CV [automated]"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Rebase failed while updating rendered CV output. Manual resolution is required."
              exit 1
            fi

            if git push origin HEAD:main; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 2))
            else
              echo "::error::Failed to push rendered CV output after 3 attempts."
              exit 1
            fi
          done
